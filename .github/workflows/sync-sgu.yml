name: Синхронизация расписания с СГУ

on:
  schedule:
    # Каждый день в 06:00 по Москве (03:00 UTC).
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Синхронизация
        run: node scripts/sync-sgu.mjs
      - name: Сохранить изменения (если есть)
        run: |
          if git diff --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "sgu-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/lib/seed.ts
          git commit -m "Расписание: новые пары с сайта СГУ"
          git push
